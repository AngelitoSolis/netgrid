  # ── DataForSEO volume/difficulty refresh (T10 Step 10) ────────────────────
  #
  # SPENDS REAL MONEY. Disabled until DATAFORSEO_CRON_ENABLED=1 is set on the
  # WEB service — with the flag unset this service runs and the route returns
  # a no-op summary explaining why, so it is safe to leave scheduled.
  #
  # Daily, not hourly, and a single shard. Volume data does not move fast
  # enough to justify a higher rate, and a low rate means budget exhaustion
  # degrades to "covered less of the network this month" rather than to a
  # surprise bill.
  #
  # Rollout: deploy, invoke once by hand with ?limit=1, read dataforseo_runs
  # and confirm the billed cost, THEN set the flag. A budget bug here spends
  # real money on a schedule.
  - type: cron
    name: netgrid-cron-dataforseo-refresh
    runtime: docker
    schedule: "10 4 * * *"
    dockerfilePath: ./cron/Dockerfile
    dockerContext: ./cron
    envVars:
      - key: CRON_PATH
        value: /api/cron/dataforseo-refresh?shard=0&shardCount=1
      - key: APP_URL
        value: https://netgrid-16f6.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: netgrid
          envVarKey: CRON_SECRET
      - key: CRON_MAX_TIME
        value: "660"
